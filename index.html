<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Gallery</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Space+Mono:wght@400&display=swap" rel="stylesheet">

<style>
:root {
  --bg:        #0f0d0a;
  --surface:   rgba(20,18,14,.92);
  --border:    rgba(212,197,169,.18);
  --border-hi: rgba(212,197,169,.55);
  --gold:      #d4c5a9;
  --gold-dim:  #7a6e5c;
  --text-dim:  #555;
  --accent:    #c8a96e;
  --danger:    #b54a3a;
  --radius:    2px;
  --font-ui:   'Space Mono', monospace;
  --font-head: 'Cormorant Garamond', serif;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

#c {
  display: block;
  width: 100%;
  height: 600px;
  cursor: crosshair;
  transition: cursor .15s;
}
#c.walk-mode { cursor: grab; }
#c.walk-mode:active { cursor: grabbing; }

#wrap {
  position: relative;
  user-select: none;
  font-family: var(--font-ui);
  background: var(--bg);
}

#header {
  position: absolute;
  top: 0; left: 0; right: 148px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  background: linear-gradient(to bottom, rgba(15,13,10,.95) 0%, rgba(15,13,10,0) 100%);
  z-index: 10;
  pointer-events: none;
}
#gallery-title {
  font-family: var(--font-head);
  font-size: 18px;
  font-weight: 300;
  font-style: italic;
  color: var(--gold);
  letter-spacing: .12em;
}
#save-status {
  font-size: 8px;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--text-dim);
  transition: color .3s;
}
#save-status.saved   { color: #6aaa7a; }
#save-status.saving  { color: var(--accent); }
#save-status.error   { color: var(--danger); }

#ui {
  position: absolute;
  top: 10px;
  left: calc(50% - 74px - 74px);
  transform: translateX(-50%);
  display: flex;
  gap: 5px;
  z-index: 10;
}

.btn {
  background-image: linear-gradient(to bottom, rgba(250, 172, 255, 1) 0%,rgba(255, 255, 255, 1) 48%,rgba(6, 69, 255, 1) 100%);
  background-color: rgba(20,18,14,.6);
  color: #e8d8ff;
  border: 1px solid transparent;
  border-image: linear-gradient(to bottom, rgba(226,147,255,1) 0%, rgba(154,166,255,0) 100%) 1;
  box-shadow: 0px 2px 2px 0px rgba(40,52,255,0.616);
  padding: 7px 12px;
  font-size: 9px;
  letter-spacing: .12em;
  text-transform: uppercase;
  cursor: pointer;
  font:normal none 400 14/1.2 "Special Gothic Expanded One";
  transition: all .2s;
  border-radius: var(--radius);
  position: relative;
  white-space: nowrap;
}
.btn:hover, .btn.active {
  background-image: linear-gradient(to bottom, rgba(250,172,255,0.85) 0%, rgba(65,112,255,0.2) 50%, rgba(6,69,255,0.9) 98%);
  color: #fff;
  box-shadow: 0px 3px 8px 0px rgba(40,52,255,0.7);
}
.btn.danger:hover {
  background-image: linear-gradient(to bottom, rgba(255,100,100,0.4) 0%, rgba(181,74,58,0) 50%, rgba(181,74,58,0.6) 98%);
  border-image: linear-gradient(to bottom, rgba(255,120,120,1) 0%, rgba(181,74,58,0) 100%) 1;
  color: #ffaaaa;
  box-shadow: 0px 2px 6px 0px rgba(181,74,58,0.6);
}

.btn[data-tip]::after {
  content: attr(data-tip);
  position: absolute;
  bottom: -26px; left: 50%; transform: translateX(-50%);
  background: rgba(20,18,14,.95);
  color: var(--gold-dim);
  font-size: 7px;
  letter-spacing: .1em;
  padding: 3px 7px;
  border: .5px solid var(--border);
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity .2s;
  border-radius: var(--radius);
}
.btn[data-tip]:hover::after { opacity: 1; }

#info {
  position: absolute;
  bottom: 14px;
  left: 50%;
  transform: translateX(calc(-50% - 74px));
  background: linear-gradient(to bottom, rgba(250, 172, 255, 1) 0%,rgba(255, 255, 255, 1) 48%,rgba(6, 69, 255, 1) 100%);
  color: var(--gold-dim);
  border: .5px solid var(--border);
  padding: 6px 16px;
  font-size: 8px;
  letter-spacing: .13em;
  text-transform: uppercase;
  pointer-events: none;
  white-space: nowrap;
  border-radius:50px;
  backdrop-filter: blur(4px);
}

#panel {
  position: absolute;
  right: 0; top: 0; bottom: 0;
  width: 160px;
  background: rgba(143, 210, 243, 1);
  border-left: .5px solid var(--border);
  display: flex;
  flex-direction: column;
  z-index: 10;
  overflow-y: auto;
}
#panel::-webkit-scrollbar { width: 3px; }
#panel::-webkit-scrollbar-thumb { background: rgba(212,197,169,.15); }

.ph {
  color: var(--gold);
  font-family: var(--font-head);
  font-size: 13px;
  font-style: italic;
  font-weight: 300;
  letter-spacing: .1em;
  padding: 12px 12px 8px;
  border-bottom: .5px solid var(--border);
}

.sl {
  color: var(--text-dim);
  font-size: 7px;
  letter-spacing: .18em;
  text-transform: uppercase;
  padding: 9px 12px 4px;
}

.tg {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  padding: 4px 10px;
}
.thumb {
  aspect-ratio: 4/3;
  cursor: pointer;
  border: 1.5px solid transparent;
  transition: border-color .2s;
  display: block;
  width: 100%;
  border-radius: var(--radius);
}
.thumb:hover, .thumb.sel { border-color: var(--gold); }

.uz {
  margin: 5px 10px;
  padding: 10px 5px;
  text-align: center;
  cursor: pointer;
  background-image: linear-gradient(to bottom, rgba(250,172,255,0.676) 0%, rgba(65,112,255,0) 50%, rgba(6,69,255,0.75) 98%);
  background-color: rgba(20,18,14,.6);
  font-family: 'Special Gothic Expanded One;', serif;
  color: linear-gradient(to bottom, rgba(255, 255, 255, 1) 23%,rgba(27, 152, 234, 1) 100%);
  border: 1px solid transparent;
  border-image: linear-gradient(to bottom, rgba(226,147,255,1) 0%, rgba(154,166,255,0) 100%) 1;
  box-shadow: 0px 2px 2px 0px rgba(40,52,255,0.616);
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  line-height: 1.8;
  transition: all .2s;
  border-radius: var(--radius);
}
.uz:hover {
  background-image: linear-gradient(to bottom, rgba(250,172,255,0.85) 0%, rgba(65,112,255,0.2) 50%, rgba(6,69,255,0.9) 98%);
  color: #fff;
  box-shadow: 0px 3px 8px 0px rgba(40,52,255,0.7);
}

.uw { padding: 3px 10px; }
.uth {
  width: 100%; aspect-ratio: 4/3;
  object-fit: cover;
  display: block;
  cursor: pointer;
  border: 1.5px solid transparent;
  transition: border-color .2s;
  margin-bottom: 2px;
  background: #1a1814;
  border-radius: var(--radius);
}
.uth:hover, .uth.sel { border-color: var(--gold); }
.utl {
  font-size: 7px;
  color: var(--text-dim);
  letter-spacing: .06em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-bottom: 5px;
}
.model-thumb {
  width: 100%; aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  cursor: pointer;
  border: 1.5px solid transparent;
  transition: border-color .2s;
  margin-bottom: 2px;
  background: #111;
  border-radius: var(--radius);
}
.model-thumb:hover, .model-thumb.sel { border-color: var(--gold); }

#hint {
  color: var(--text-dim);
  font-size: 7px;
  letter-spacing: .09em;
  text-transform: uppercase;
  padding: 10px 12px;
  line-height: 2;
  border-top: .5px solid rgba(212,197,169,.08);
  margin-top: auto;
}

#loading-overlay {
  position: absolute;
  inset: 0;
  background: rgba(15,13,10,.88);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 20;
  backdrop-filter: blur(2px);
}
#loading-overlay.show { display: flex; }
.ld-txt {
  color: var(--gold);
  font-size: 9px;
  letter-spacing: .22em;
  text-transform: uppercase;
  margin-bottom: 16px;
}
.ld-bar {
  width: 140px;
  height: 1px;
  background: rgba(212,197,169,.12);
}
.ld-fill {
  height: 100%;
  background: var(--gold);
  width: 0%;
  transition: width .3s;
}

#toast {
  position: absolute;
  bottom: 50px;
  left: 50%;
  transform: translateX(calc(-50% - 74px)) translateY(20px);
  background: rgba(20,18,14,.96);
  border: .5px solid var(--border);
  color: var(--gold);
  font-size: 9px;
  letter-spacing: .14em;
  text-transform: uppercase;
  padding: 8px 18px;
  border-radius: var(--radius);
  pointer-events: none;
  opacity: 0;
  transition: opacity .3s, transform .3s;
  z-index: 30;
  backdrop-filter: blur(4px);
  white-space: nowrap;
}
#toast.show {
  opacity: 1;
  transform: translateX(calc(-50% - 74px)) translateY(0);
}
#toast.success { border-color: #6aaa7a; color: #6aaa7a; }
#toast.error   { border-color: var(--danger); color: var(--danger); }

.remove-btn {
  position: absolute;
  top: 2px; right: 2px;
  width: 16px; height: 16px;
  background: rgba(181,74,58,.85);
  color: #fff;
  font-size: 8px;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity .2s;
  border-radius: 1px;
}
.uw > .item-wrap:hover .remove-btn { opacity: 1; }
.item-wrap { position: relative; }

#minimap {
  position: absolute;
  bottom: 14px;
  left: 14px;
  width: 70px;
  height: 70px;
  background: rgba(15,13,10,.82);
  border: .5px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  z-index: 10;
  pointer-events: none;
}
#minimap canvas { width: 100%; height: 100%; }
</style>
</head>

<body style="background:#0f0d0a;">
<div id="wrap">
  <canvas id="c"></canvas>

  <div id="header">
    <span id="gallery-title">Gallery · 3D</span>
    <span id="save-status">—</span>
  </div>

  <div id="ui">
    <button class="btn active" id="btn-walk"  data-tip="W A S D để di chuyển">🚶 Walk</button>
    <button class="btn"        id="btn-place" data-tip="Click tường / sàn để đặt">📌 Place</button>
    <button class="btn danger" id="btn-reset" data-tip="Xoá tất cả, về mặc định">↺ Reset</button>
    <button class="btn"        id="btn-save"  data-tip="Lưu vào database">💾 Save</button>
    <button class="btn"        id="btn-cam"   data-tip="Reset vị trí camera">⌖ Cam</button>
  </div>

  <div id="panel">
    <div class="ph">Tác phẩm</div>

    <div class="sl">Tranh mẫu</div>

      + JPG · PNG · MP4
    </div>
    <input type="file" id="fi-img" accept="image/*,video/*" multiple style="display:none">
    <div class="uw" id="uw-img"></div>

    </div>
    <input type="file" id="fi-3d" accept=".glb,.gltf,.obj" multiple style="display:none">

    <div id="hint">
      Chọn tác phẩm<br>
      → bật Place<br>
      → click sàn/tường<br>
      <br>
      Model 3D → sàn<br>
      Tranh → tường
    </div>
  </div>

  <div id="loading-overlay">
    <div class="ld-txt" id="ld-txt">Đang tải...</div>
    <div class="ld-bar"><div class="ld-fill" id="ld-fill"></div></div>
  </div>

  <div id="info">W A S D · Kéo chuột để xoay</div>
  <div id="toast"></div>
  <div id="minimap"><canvas id="minimap-canvas" width="70" height="70"></canvas></div>
</div>

/* ── TOAST ── */
function toast(msg, type = 'info', duration = 2800) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + type;
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = ''; }, duration);
}

/* ── TRANH MẪU ── */
const artDefs = [
  (ctx, w, h) => {
    ctx.fillStyle = '#0a1a3a'; ctx.fillRect(0,0,w,h);
    for (let i = 0; i < 8; i++) {
      const g = ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,40);
      g.addColorStop(0,'rgba(80,120,255,.6)'); g.addColorStop(1,'rgba(0,20,80,0)');
      ctx.fillStyle = g; ctx.beginPath();
      ctx.arc(w/2+Math.sin(i)*30, h/2+Math.cos(i)*20, 18-i*1.5, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,220,100,.9)'; ctx.beginPath();
    ctx.arc(w/2, h/2, 5, 0, Math.PI*2); ctx.fill();
  },
  (ctx, w, h) => {
    const cols = ['#c84b31','#e8a020','#2d6a4f','#f4a261','#264653'];
    for (let i = 0; i < 24; i++) {
      ctx.fillStyle = cols[i % cols.length];
      ctx.fillRect(Math.random()*w, Math.random()*h, 15+Math.random()*35, 15+Math.random()*35);
    }
  },
  (ctx, w, h) => {
    ctx.fillStyle = '#f0ede8'; ctx.fillRect(0,0,w,h);
    ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth = 1.5;
    for (let i = 0; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo(10+i*18, 10);
      ctx.bezierCurveTo(w-10, h*.3, 10, h*.7, w-10+i*5, h-10);
      ctx.stroke();
    }
    ctx.fillStyle = '#c84b31'; ctx.beginPath();
    ctx.arc(w*.6, h*.4, 12, 0, Math.PI*2); ctx.fill();
  },
  (ctx, w, h) => {
    const g = ctx.createLinearGradient(0,0,w,h);
    g.addColorStop(0,'#0d0d0d'); g.addColorStop(.5,'#1a0a2e'); g.addColorStop(1,'#0a1a3a');
    ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
    for (let i = 0; i < 60; i++) {
      ctx.fillStyle = `rgba(255,255,255,${Math.random()*.8+.2})`;
      ctx.beginPath(); ctx.arc(Math.random()*w, Math.random()*h, Math.random()*2, 0, Math.PI*2);
      ctx.fill();
    }
  }
];

artDefs.forEach((fn, i) => {
  const c = document.getElementById('art' + i);
  fn(c.getContext('2d'), 60, 45);
});

function makeArtCanvas(i) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 384;
  artDefs[i](c.getContext('2d'), 512, 384);
  return c;
}

  const l = new THREE.SpotLight(0xffe0a0, i, 18, Math.PI/5, .55, 1.3);
  l.position.set(x, 4.85, z);

    new THREE.MeshBasicMaterial({ color: 0xffddaa })
  );

  scene.add(b);

[[-4,-5],[-1,-5],[2,-5],[-4,0],[-1,0],[2,0],[-4,5],[-1,5],[2,5]]

function makePedestal(pos) {
  const g    = new THREE.Group();
  const base = new THREE.Mesh(new THREE.BoxGeometry(1.1,.08,1.1), new THREE.MeshLambertMaterial({ color: 0xddd8d0 }));
  base.position.y = .04; g.add(base);
  const col  = new THREE.Mesh(new THREE.BoxGeometry(.9,.8,.9),   new THREE.MeshLambertMaterial({ color: 0xf0ece6 }));

  const top  = new THREE.Mesh(new THREE.BoxGeometry(1.05,.06,1.05), new THREE.MeshLambertMaterial({ color: 0xddd8d0 }));
  top.position.y = .87; g.add(top);
  g.position.copy(pos);
  scene.add(g);
  return g;
}

/* =====================================================================

// Hàm chuyển animation mượt (cross-fade 0.25s)
function switchAction(next) {
  if (!next || next === currentAction) return;
  if (currentAction) {
    currentAction.fadeOut(0.25);
  }
  next.reset().fadeIn(0.25).play();
  currentAction = next;
}

// Load character.glb — dùng window.__GLTFLoader để tránh lỗi module scope
const charLoader = new window.__GLTFLoader();
charLoader.load(
  'character.glb',

  // onLoad
  (gltf) => {
    playerCharacter = gltf.scene;

    // Scale nhân vật về chiều cao ~1.7m
    // Mixamo export cm -> model rat nho (0.006 don vi), can scale lon
    const box    = new THREE.Box3().setFromObject(playerCharacter);
    const size   = box.getSize(new THREE.Vector3());
    // Dung chieu cao Y de scale (tranh bi sai do tay/chan lam maxDim lon)
    // Model Mixamo don vi cm, size.y~0.006 la dung roi, khong can scale
    // Giu nguyen scale = 1, chi can can chan cham san

    // Tinh lai box sau khi scale de chan cham dung mat san
    playerCharacter.updateMatrixWorld(true);
    const box2 = new THREE.Box3().setFromObject(playerCharacter);
    window.__charGroundOffset = -box2.min.y;

    // Bat shadow cho toan bo mesh trong model
    playerCharacter.traverse(c => {
      if (c.isMesh) {
        c.castShadow    = true;
        c.receiveShadow = true;
      }
    });

    scene.add(playerCharacter);

    // Ẩn fallback
    fallbackChar.visible = false;

    // Tạo AnimationMixer
    charMixer = new THREE.AnimationMixer(playerCharacter);

    const clips = gltf.animations;
    const findClip = (name) => clips.find(c => c.name.toLowerCase() === name) || null;

    const idleClip = findClip('idle');
    const walkClip = findClip('walk');
    const turnClip = findClip('turn');

    if (idleClip) actionIdle = charMixer.clipAction(idleClip);
    if (walkClip) actionWalk = charMixer.clipAction(walkClip);
    if (turnClip) actionTurn = charMixer.clipAction(turnClip);

    // Bắt đầu bằng Idle
    if (actionIdle) {
      actionIdle.play();
      currentAction = actionIdle;
    }

    charReady = true;
    toast('Nhân vật đã sẵn sàng ✓', 'success');
  },

  // onProgress
  (xhr) => {
    if (xhr.lengthComputable) {
      const pct = Math.round(xhr.loaded / xhr.total * 100);
      document.getElementById('ld-fill').style.width = pct + '%';
    }
  },

  // onError
  (err) => {
    console.warn('Không load được character.glb, dùng fallback:', err);
    // Fallback vẫn đang hiển thị, không cần làm gì thêm
  }
);

/* ── ĐẶT TRANH ── */
function placeArtwork(src, pos, rot) {
  let tex;
  if (src.canvas) tex = new THREE.CanvasTexture(src.canvas);
  else            tex = src.texture;

  const AW = 2.2, AH = 1.65;
  const frame = new THREE.Mesh(new THREE.BoxGeometry(AW+.16, AH+.16, .08), frameMat);
  frame.position.copy(pos); frame.rotation.set(...rot);
  scene.add(frame);

  const plane = new THREE.Mesh(
    new THREE.PlaneGeometry(AW, AH),
    new THREE.MeshLambertMaterial({ map: tex })
  );
  const n = new THREE.Vector3(Math.sin(rot[1]), 0, Math.cos(rot[1]));
  plane.position.copy(pos).addScaledVector(n, .046);
  plane.rotation.set(...rot);
  scene.add(plane);

  const sl = new THREE.SpotLight(0xfff2d0, 2.2, 10, Math.PI / 7, 0.6, 1);
  scene.add(sl); scene.add(sl.target);

  artworks.push({
    frame, plane, light: sl, tgt: sl.target,
    isVideo: src.isVideo,
    tex:     src.isVideo ? tex : null,
    builtinIdx: src.builtinIdx !== undefined ? src.builtinIdx : null,
    storageUrl: src.storageUrl || null
  });
}

/* ── ĐẶT MODEL 3D ── */
function place3DModel(object, pos) {
  const box   = new THREE.Box3().setFromObject(object);
  const size  = box.getSize(new THREE.Vector3());
  const maxDim= Math.max(size.x, size.y, size.z);
  object.scale.setScalar(1.2 / maxDim);
  object.position.copy(pos);
  object.position.y = .88;
  scene.add(object);

  const pl = new THREE.PointLight(0xfff0dd, 1.5, 4);
  pl.position.set(pos.x, pos.y+2, pos.z);
  scene.add(pl);

  const ped = makePedestal(new THREE.Vector3(pos.x, 0, pos.z));
  models3d.push({ object, light: pl, pedestal: ped });
}

/* ── UPLOAD ── */
async function uploadToStorage(file) {
  const ext  = file.name.split('.').pop();
  const path = `uploads/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
  const { error } = await supabase.storage.from(STORAGE_BUCKET).upload(path, file, { upsert: true });
  if (error) throw error;
  const { data } = supabase.storage.from(STORAGE_BUCKET).getPublicUrl(path);
  return { url: data.publicUrl, path };
}

function addImageFromUrl(url, fileName, wrap) {
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      const cv = document.createElement('canvas');
      cv.width = 512; cv.height = 384;
      cv.getContext('2d').drawImage(img, 0, 0, 512, 384);
      const tex = new THREE.CanvasTexture(cv);
      const src = { type:'user', isVideo:false, canvas:cv, texture:tex, storageUrl:url };

      const wrap_item = document.createElement('div');
      wrap_item.className = 'item-wrap';
      const th = document.createElement('canvas');
      th.width = 120; th.height = 90; th.className = 'uth';
      th.getContext('2d').drawImage(img, 0, 0, 120, 90);
      th.addEventListener('click', () => { selectSource(src); th.classList.add('sel'); });
      const lbl = document.createElement('div');
      lbl.className = 'utl';
      lbl.textContent = (fileName || '').substring(0, 20);
      wrap_item.appendChild(th);
      wrap_item.appendChild(lbl);
      wrap.appendChild(wrap_item);

      selectSource(src); th.classList.add('sel');
      resolve(src);
    };
    img.onerror = () => resolve(null);
    img.src = url;
  });
}

/* ── RAYCAST ── */
const raycaster = new THREE.Raycaster();
const mouse     = new THREE.Vector2();

canvas.addEventListener('click', e => {
  if (mode !== 'place') return;
  const rect = canvas.getBoundingClientRect();
  mouse.x =  ((e.clientX - rect.left) / rect.width)  * 2 - 1;
  mouse.y = -((e.clientY - rect.top)  / rect.height)  * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  if (selectedSource.type === 'model3d') {
    const hits = raycaster.intersectObject(floorPlane);
    if (!hits.length) return;
    const pt = hits[0].point.clone();
    pt.x = Math.max(-6.5, Math.min(6.5, pt.x));
    pt.z = Math.max(-6.5, Math.min(6.5, pt.z));
    const clone = selectedSource.object.clone();
    place3DModel(clone, pt);
    toast('Model đặt thành công', 'success');
  } else {
    const hits = raycaster.intersectObjects(wallMeshes);
    if (!hits.length) return;
    const hit = hits[0];
    const pt  = hit.point.clone();
    pt.y = Math.max(1.1, Math.min(3.6, pt.y));
    const n = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
    pt.add(n.clone().multiplyScalar(.05));
    const rot = [0, Math.atan2(n.x, n.z), 0];

    if (selectedSource.type === 'builtin') {
      placeArtwork({ canvas:makeArtCanvas(selectedSource.idx), builtinIdx:selectedSource.idx }, pt, rot);
    } else if (selectedSource.isVideo) {
      selectedSource.videoEl.play();
      placeArtwork({ isVideo:true, texture:selectedSource.texture, storageUrl:selectedSource.storageUrl }, pt, rot);
    } else {
      placeArtwork({ canvas:selectedSource.canvas, texture:selectedSource.texture, storageUrl:selectedSource.storageUrl }, pt, rot);
    }
    toast('Tranh đã đặt lên tường', 'success');
  }
});

/* ── MINIMAP ── */
const mmCanvas = document.getElementById('minimap-canvas');
const mmCtx    = mmCanvas.getContext('2d');

function drawMinimap() {
  const S = 70;
  mmCtx.clearRect(0,0,S,S);
  mmCtx.fillStyle = 'rgba(15,13,10,.8)';
  mmCtx.fillRect(0,0,S,S);
  const scale = 60/20;
  mmCtx.strokeStyle = 'rgba(212,197,169,.25)';
  mmCtx.lineWidth = .5;
  mmCtx.strokeRect(5,5,60,60);
  artworks.forEach(a => {
    const mx = (a.frame.position.x + 10) * scale + 5;
    const my = (a.frame.position.z + 10) * scale + 5;
    mmCtx.fillStyle = 'rgba(212,197,169,.55)';
    mmCtx.fillRect(mx-1.5, my-1.5, 3, 3);
  });
  const cx = (camera.position.x + 10) * scale + 5;
  const cy = (camera.position.z + 10) * scale + 5;
  mmCtx.save();
  mmCtx.translate(cx, cy);
  mmCtx.rotate(-yaw);
  mmCtx.fillStyle = '#c8a96e';
  mmCtx.beginPath();
  mmCtx.moveTo(0,-5); mmCtx.lineTo(3,3); mmCtx.lineTo(-3,3);
  mmCtx.closePath(); mmCtx.fill();
  mmCtx.restore();
}

/* ── ANIMATION LOOP ── */
function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();

  camera.rotation.order = 'YXZ';
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  dir.set(0,0,0);
  if (keys['w'] || keys['arrowup'])    dir.z -= 1;
  if (keys['s'] || keys['arrowdown'])  dir.z += 1;
  if (keys['a'] || keys['arrowleft'])  dir.x -= 1;
  if (keys['d'] || keys['arrowright']) dir.x += 1;

  const isMoving = dir.length() > 0;

  if (isMoving) {
    dir.normalize().applyEuler(new THREE.Euler(0, yaw, 0));
    camera.position.addScaledVector(dir, .07);
    camera.position.x = Math.max(-7.5, Math.min(7.5, camera.position.x));
    camera.position.z = Math.max(-7.5, Math.min(7.5, camera.position.z));
    camera.position.y = 1.7;
  }

  // === NHÂN VẬT ===
  {
    const rawDir = new THREE.Vector3();
    if (keys['w'] || keys['arrowup'])    rawDir.z -= 1;
    if (keys['s'] || keys['arrowdown'])  rawDir.z += 1;
    if (keys['a'] || keys['arrowleft'])  rawDir.x -= 1;
    if (keys['d'] || keys['arrowright']) rawDir.x += 1;

    // Neu dang di: cap nhat huong theo phim bam
    // Neu dung: giu nguyen huong cuoi, khong quay lai nhin camera
    if (rawDir.length() > 0) {
      const moveAngle = Math.atan2(rawDir.x, rawDir.z);
      prevCharFacing = yaw + moveAngle;
    }
    // charFacing luon = huong cuoi cung da di, khong doi khi dung
    const charFacing = prevCharFacing;
    const isTurning = false; // don gian hoa, bo turn detection

    // Đặt nhân vật phía trước camera
    const offset = new THREE.Vector3(0, 0, -2.0);
    offset.applyEuler(new THREE.Euler(0, yaw, 0));

    if (charReady && playerCharacter) {
      // --- GLB character ---
      // Smooth rotate
      let rot_delta = charFacing - playerCharacter.rotation.y;
      while (rot_delta >  Math.PI) rot_delta -= Math.PI * 2;
      while (rot_delta < -Math.PI) rot_delta += Math.PI * 2;
      playerCharacter.rotation.y += rot_delta * 0.2;

      // Nhan vat luon o phia truoc camera theo chieu ngang (yaw)
      // Khong bi anh huong boi pitch (ngang/cui camera)
      const charOffset = new THREE.Vector3(0, 0, -2.0);
      charOffset.applyEuler(new THREE.Euler(0, yaw, 0)); // chi dung yaw, bo pitch
      const newX = camera.position.x + charOffset.x;
      const newZ = camera.position.z + charOffset.z;
      // Giu trong phong
      playerCharacter.position.x = Math.max(-6.5, Math.min(6.5, newX));
      playerCharacter.position.z = Math.max(-6.5, Math.min(6.5, newZ));
      playerCharacter.position.y = window.__charGroundOffset || 0;

      // Switch animation theo trạng thái
      if (isMoving) {
        switchAction(actionWalk || actionIdle);
      } else if (isTurning && actionTurn) {
        switchAction(actionTurn);
      } else {
        switchAction(actionIdle);
      }

      // Cập nhật mixer
      if (charMixer) charMixer.update(delta);

    } else {
      // --- Fallback geometry character ---
      let fb_delta = charFacing - fallbackChar.rotation.y;
      while (fb_delta >  Math.PI) fb_delta -= Math.PI * 2;
      while (fb_delta < -Math.PI) fb_delta += Math.PI * 2;
      fallbackChar.rotation.y += fb_delta * 0.2;

      fallbackChar.position.x = camera.position.x + offset.x;
      fallbackChar.position.z = camera.position.z + offset.z;
      fallbackChar.position.y = 0;

      if (isMoving) charWalkPhase += 0.18;
      else          charWalkPhase *= 0.85;

      const sw = Math.sin(charWalkPhase);
      const ud = fallbackChar.userData;
      ud.legLU.rotation.x =  sw * 0.45;
      ud.legLL.rotation.x = -Math.max(0, sw) * 0.4;
      ud.legRU.rotation.x = -sw * 0.45;
      ud.legRL.rotation.x =  Math.max(0, -sw) * 0.4;
      ud.armL.rotation.x  = -sw * 0.4;
      ud.armR.rotation.x  =  sw * 0.4;
      ud.shoeL.position.z = 0.02 + Math.max(0, sw) * 0.03;
      ud.shoeR.position.z = 0.02 + Math.max(0, -sw) * 0.03;
    }
  }

  artworks.forEach(a => { if (a.isVideo && a.tex) a.tex.needsUpdate = true; });
  models3d.forEach(m => { m.object.rotation.y += .005; });

  drawMinimap();
  renderer.render(scene, camera);
}
animate();

/* ── SAVE ── */
async function saveGallery() {
  const statusEl = document.getElementById('save-status');
  statusEl.textContent = 'Saving…'; statusEl.className = 'saving';

  const galleryData = {
    artworks: artworks.map(a => ({
      x: a.frame.position.x,
      y: a.frame.position.y,
      z: a.frame.position.z,
      ry: a.frame.rotation.y,
      builtinIdx: a.builtinIdx !== undefined ? a.builtinIdx : null,
      storageUrl: a.storageUrl || null,
      isVideo:    a.isVideo || false
    })),
    models: models3d.map(m => ({
      x: m.object.position.x,
      y: m.object.position.y,
      z: m.object.position.z
    }))
  };

  try {
    await supabase.from("gallery").delete().eq("name", GALLERY_NAME);
    const { error } = await supabase
      .from("gallery")
      .insert([{ name: GALLERY_NAME, scene_data: galleryData }]);

    if (error) {
      statusEl.textContent = 'Lỗi'; statusEl.className = 'error';
      toast('Lưu lỗi: ' + error.message, 'error');
    } else {
      statusEl.textContent = 'Saved ✓'; statusEl.className = 'saved';
      toast('Đã lưu vào database ✓', 'success');
      setTimeout(() => { statusEl.textContent = '—'; statusEl.className = ''; }, 4000);
    }
  } catch (e) {
    statusEl.textContent = 'Lỗi'; statusEl.className = 'error';
    toast('Lỗi: ' + e.message, 'error');
  }
}

/* ── LOAD ── */
async function loadGallery() {
  try {
    const { data, error } = await supabase
      .from("gallery")
      .select("*")
      .eq("name", GALLERY_NAME)
      .order("created_at", { ascending: false })
      .limit(1);

    if (error)                          { console.error("Load error:", error); return; }
    if (!data || data.length === 0)     { console.log("Không có dữ liệu save"); return; }

    const scene_data = data[0].scene_data;

    artworks.forEach(a => {
      scene.remove(a.frame); scene.remove(a.plane);
      scene.remove(a.light); scene.remove(a.tgt);
    });
    artworks.length = 0;

    if (!scene_data.artworks || scene_data.artworks.length === 0) return;

    const wrap = document.getElementById('uw-img');

    for (const a of scene_data.artworks) {
      const pos = new THREE.Vector3(a.x, a.y, a.z);
      const rot = [0, a.ry || 0, 0];

      if (a.storageUrl) {
        if (a.isVideo) {
          const vid = document.createElement('video');
          vid.src = a.storageUrl; vid.loop = true; vid.muted = true;
          vid.playsInline = true; vid.crossOrigin = 'anonymous';
          vid.addEventListener('loadeddata', () => {
            const tex = new THREE.VideoTexture(vid);
            tex.minFilter = THREE.LinearFilter;
            placeArtwork({ type:'user', isVideo:true, texture:tex, videoEl:vid, storageUrl:a.storageUrl }, pos, rot);
            vid.play();
          });
        } else {
          const src = await addImageFromUrl(a.storageUrl, a.storageUrl.split('/').pop(), wrap);
          if (src) placeArtwork({ ...src, storageUrl:a.storageUrl }, pos, rot);
        }
      } else {
        const idx = Math.min(3, Math.max(0, parseInt(a.builtinIdx) || 0));
        placeArtwork({ canvas:makeArtCanvas(idx), builtinIdx:idx }, pos, rot);
      }
    }

    toast('Gallery đã được khôi phục ✓', 'success');
  } catch (e) {
    console.error("Load lỗi:", e);
  }
}

document.getElementById('btn-save').addEventListener('click', saveGallery);
loadGallery();

})();
</script>
